min_version = "2026.9.13"

[bootstrap.hooks]
pre-dotfiles = 'bash "{{ config_root }}/scripts/check-dotfiles.sh"'

[tools]
bats = "1.14.0"

# Only Git-indexed files are copied. Never deploy caches, sessions, credentials,
# or other runtime files left in a checkout by the old symlink installer.
[dotfiles]
"~/.config" = { source = "config", mode = "copy", manifest = "git", exclude = [
  "_bashrc",
  "_bash_profile",
  "_inputrc",
  "_pi",
  "_agents",
  "git/config",
] }
"~/.pi" = { source = "config/_pi", mode = "copy", manifest = "git" }
"~/.agents" = { source = "config/_agents", mode = "copy", manifest = "git" }
"~/.local/bin" = { source = "bin", mode = "copy", manifest = "git" }
"~/.config/mise/conf.d" = { source = "mise/conf.d", mode = "copy", manifest = "git" }

# A source + template declares a fenced-block edit, NOT a whole-file template.
# These sources contain literal shell/inputrc/Git text (no Tera expressions).
"~/.bashrc/dotfiles" = { source = "config/_bashrc", template = "tera", comment = "#" }
"~/.bash_profile/dotfiles" = { source = "config/_bash_profile", template = "tera", comment = "#" }
"~/.inputrc/dotfiles" = { source = "config/_inputrc", template = "tera", comment = "#" }
"~/.config/git/config/dotfiles" = { source = "config/git/config", template = "tera", comment = "#" }

[tasks.test]
description = "Run bats test suite"
run = "bats tests/"
